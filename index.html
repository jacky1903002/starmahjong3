<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>明星三缺一 - 邀請碼線上對戰</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
    <style>
        .mahjong-tile-real {
            width: 52px; height: 82px;
            background: linear-gradient(135deg, #ffffff 0%, #fffbeb 50%, #fef3c7 100%);
            border: 3px solid #d97706; border-bottom: 6px solid #b45309; border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4), inset 0 2px 3px rgba(255,255,255,0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            user-select: none; transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin: 0 1px; cursor: pointer; flex-shrink: 0;
        }
        @media (min-width: 640px) {
            .mahjong-tile-real { width: 64px; height: 100px; border: 3.5px solid #f59e0b; border-bottom: 7px solid #d97706; border-radius: 12px; margin: 0 2px; }
        }
        .mahjong-tile-real:hover, .mahjong-tile-real:active {
            transform: translateY(-8px) scale(1.05); box-shadow: 0 12px 20px rgba(245, 158, 11, 0.7); border-color: #fbbf24;
        }
        .tile-number { font-size: 1.6rem; font-weight: 900; line-height: 1; }
        @media (min-width: 640px) { .tile-number { font-size: 2rem; } }
        .tile-suit { font-size: 0.9rem; font-weight: 900; margin-top: -1px; }
        @media (min-width: 640px) { .tile-suit { font-size: 1.05rem; } }
        .tile-red { color: #dc2626 !important; }
        .tile-green { color: #16a34a !important; }
        .tile-blue { color: #2563eb !important; }
        .tile-dark { color: #0f172a !important; }

        .mahjong-dot-container {
            width: 32px; height: 38px; background: #eff6ff; border: 2px solid #3b82f6; border-radius: 6px;
            display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 1.5px; padding: 2px;
        }
        @media (min-width: 640px) { .mahjong-dot-container { width: 38px; height: 44px; gap: 2px; } }
        .m-dot { width: 7px; height: 7px; border-radius: 50%; background: #dc2626; }
        @media (min-width: 640px) { .m-dot { width: 9px; height: 9px; } }
        .m-dot.green { background: #16a34a; } .m-dot.blue { background: #2563eb; }

        .mahjong-bamboo-container {
            width: 32px; height: 38px; background: #f0fdf4; border: 2px solid #22c55e; border-radius: 6px;
            display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 1.5px; padding: 2px;
        }
        @media (min-width: 640px) { .mahjong-bamboo-container { width: 38px; height: 44px; gap: 2px; } }
        .m-stick { width: 3.5px; height: 28px; background: #16a34a; border-radius: 2px; }
        @media (min-width: 640px) { .m-stick { width: 4.5px; height: 34px; } }

        .mahjong-white-board {
            width: 28px; height: 38px; background: #ffffff; border: 2.5px solid #94a3b8; border-radius: 5px;
        }
        @media (min-width: 640px) { .mahjong-white-board { width: 34px; height: 44px; } }

        .mahjong-tile-river-real {
            width: 36px; height: 50px; background: linear-gradient(135deg, #ffffff 0%, #fef3c7 100%);
            border: 2px solid #f59e0b; border-bottom: 3px solid #d97706; border-radius: 6px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 2px;
        }
        @media (min-width: 640px) { .mahjong-tile-river-real { width: 46px; height: 62px; margin: 3px; } }
        .river-num { font-size: 1rem; font-weight: 900; line-height: 1; }
        @media (min-width: 640px) { .river-num { font-size: 1.2rem; } }
        .river-suit { font-size: 0.65rem; font-weight: 900; }

        .avatar-box-giant {
            width: 65px; height: 65px; border-radius: 50%; border: 3px solid #f59e0b;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.8); overflow: hidden; background-color: #1e293b; flex-shrink: 0;
        }
        @media (min-width: 640px) { .avatar-box-giant { width: 100px; height: 100px; border: 4px solid #f59e0b; } }
        .avatar-box-giant img { width: 100%; height: 100%; object-fit: cover; object-position: center top; transform: scale(1.35); }

        .avatar-player-box {
            width: 45px; height: 45px; border-radius: 50%; border: 3px solid #10b981; overflow: hidden; flex-shrink: 0;
        }
        @media (min-width: 640px) { .avatar-player-box { width: 70px; height: 70px; } }
        .avatar-player-box img { width: 100%; height: 100%; object-fit: cover; object-position: center top; transform: scale(1.35); }

        .turn-active-glow {
            border-color: #ef4444 !important;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.9) !important;
            background-color: rgba(239, 68, 68, 0.12);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-emerald-600 via-teal-700 to-cyan-900 min-h-screen text-slate-900 flex flex-col items-center justify-center p-0 m-0 overflow-hidden">

    <!-- 登入畫面 -->
    <div id="login-screen" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center z-50 p-4 overflow-y-auto">
        <div class="bg-white/95 p-6 sm:p-8 rounded-3xl shadow-2xl w-full max-w-md border-4 border-amber-400 relative overflow-hidden my-auto">
            <div class="text-center mb-6">
                <div class="bg-gradient-to-r from-amber-500 to-orange-500 text-white w-16 h-16 sm:w-20 sm:h-20 rounded-2xl flex items-center justify-center mx-auto mb-3 text-3xl sm:text-4xl shadow-lg animate-bounce">
                    <i class="fa-solid fa-dice-one"></i>
                </div>
                <h2 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight">明星三缺一 邀請碼對決</h2>
            </div>
            <form id="login-form" class="space-y-4">
                <div id="nickname-field" class="hidden">
                    <label class="block text-xs font-black text-slate-700 mb-1 uppercase">玩家綽號 (Nickname)</label>
                    <input type="text" id="reg-nickname" class="w-full px-4 py-3 border-2 border-slate-300 rounded-2xl font-bold text-slate-900 text-sm" placeholder="例如：賭神高進">
                </div>
                <div>
                    <label class="block text-xs font-black text-slate-700 mb-1 uppercase">電子郵件 (Email)</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-3 border-2 border-slate-300 rounded-2xl font-bold text-slate-900 text-sm" placeholder="player@mahjong.com">
                </div>
                <div>
                    <label class="block text-xs font-black text-slate-700 mb-1 uppercase">密碼 (Password)</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-3 border-2 border-slate-300 rounded-2xl font-bold text-slate-900 text-sm" placeholder="••••••••">
                </div>
                <div id="login-error" class="text-red-600 text-xs font-bold text-center hidden"></div>
                <button type="submit" id="auth-submit-btn" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 text-white font-black py-3.5 rounded-2xl shadow-lg text-base">
                    登入遊戲大廳
                </button>
                <div class="text-center pt-2">
                    <button type="button" onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-xs font-bold text-teal-700 hover:underline">
                        沒有帳號？點此註冊新帳號與綽號
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 主選單大廳畫面 -->
    <div id="app-screen" class="hidden flex flex-col w-screen h-screen bg-slate-900/95 overflow-hidden">
        <header class="bg-slate-950 px-4 py-2 flex justify-between items-center border-b-2 border-amber-500/40 text-white shrink-0 z-40">
            <div class="flex items-center space-x-2">
                <div class="bg-amber-500 text-slate-950 w-8 h-8 rounded-xl flex items-center justify-center font-black">麻</div>
                <h1 class="text-sm sm:text-base font-black text-amber-400">玩家: <span id="header-nickname" class="text-white">載入中...</span></h1>
            </div>
            <div class="flex items-center space-x-3 text-xs font-bold">
                <div class="text-amber-300"><i class="fa-solid fa-coins mr-1 text-yellow-400"></i><span id="header-chips" class="text-white font-black">100,000</span></div>
                <button onclick="logoutUser()" class="bg-red-600 text-white px-3 py-1.5 rounded-xl font-black">登出</button>
            </div>
        </header>

        <!-- 模式選擇選單 -->
        <div id="lobby-mode-view" class="flex-1 p-6 flex flex-col items-center justify-center space-y-6 overflow-y-auto">
            <h2 class="text-3xl font-black text-amber-400">請選擇遊戲模式</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 w-full max-w-2xl">
                <button onclick="openTableSelect('ai')" class="bg-gradient-to-b from-teal-600 to-teal-800 p-8 rounded-3xl shadow-xl border-4 border-teal-300 text-white text-center transform hover:scale-105 transition">
                    <div class="text-3xl font-black mb-2"><i class="fa-solid fa-robot mr-2"></i>電腦對戰</div>
                    <div class="text-xs opacity-90">單人挑戰 AI 機器人</div>
                </button>
                <button onclick="openRoomLobby()" class="bg-gradient-to-b from-purple-600 to-indigo-800 p-8 rounded-3xl shadow-xl border-4 border-purple-300 text-white text-center transform hover:scale-105 transition">
                    <div class="text-3xl font-black mb-2"><i class="fa-solid fa-users mr-2"></i>四人線上對戰房</div>
                    <div class="text-xs opacity-90">建立或輸入邀請碼與真人同桌</div>
                </button>
            </div>
        </div>

        <!-- AI 底台選擇畫面 -->
        <div id="ai-table-view" class="hidden flex-1 p-6 flex flex-col items-center justify-center space-y-6 overflow-y-auto">
            <div class="text-center">
                <h2 class="text-3xl font-black text-amber-400">選擇電腦桌底台</h2>
                <button onclick="backToModeSelect()" class="text-xs text-slate-300 underline mt-1">⬅️ 返回模式選擇</button>
            </div>
            <div class="grid grid-cols-2 gap-4 w-full max-w-xl">
                <button onclick="startAiTable(50, 20)" class="bg-teal-700 p-5 rounded-2xl border-2 border-teal-300 text-white font-black text-xl">新手桌 (50/20)</button>
                <button onclick="startAiTable(100, 30)" class="bg-blue-700 p-5 rounded-2xl border-2 border-blue-300 text-white font-black text-xl">高手桌 (100/30)</button>
            </div>
        </div>

        <!-- 邀請碼線上房間大廳 -->
        <div id="online-room-view" class="hidden flex-1 p-6 flex flex-col items-center justify-center space-y-4 overflow-y-auto max-w-md mx-auto w-full">
            <div class="text-center mb-2">
                <h2 class="text-2xl font-black text-amber-400">四人線上邀請碼對戰</h2>
                <button onclick="backToModeSelect()" class="text-xs text-slate-300 underline mt-1">⬅️ 返回模式選擇</button>
            </div>

            <!-- 未加入房間前的選項 -->
            <div id="room-action-panel" class="w-full space-y-3">
                <button onclick="createRoom()" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-black py-4 rounded-2xl text-lg shadow-lg">
                    <i class="fa-solid fa-plus-circle mr-2"></i>建立新房間 (取得邀請碼)
                </button>
                <div class="flex space-x-2">
                    <input type="text" id="join-code-input" placeholder="輸入 6 位數邀請碼" class="flex-1 px-4 py-3 rounded-2xl bg-slate-950 text-white font-black border-2 border-slate-700 focus:border-amber-400 text-center uppercase tracking-widest text-lg">
                    <button onclick="joinRoomByCode()" class="bg-purple-600 hover:bg-purple-700 text-white font-black px-5 py-3 rounded-2xl text-base shadow">加入</button>
                </div>
            </div>

            <!-- 已在房間內等待畫面 -->
            <div id="room-waiting-panel" class="hidden w-full bg-slate-950 p-6 rounded-3xl border-2 border-amber-500/50 space-y-4 text-center">
                <div class="text-sm text-slate-400 font-bold">本局邀請碼</div>
                <div id="display-invite-code" class="text-4xl font-black text-amber-400 tracking-widest bg-slate-900 py-3 rounded-2xl border border-amber-500/30">------</div>
                <p class="text-xs text-slate-300">請將邀請碼告訴其他三位玩家，滿 4 人即可開局</p>
                
                <div class="text-left bg-slate-900 p-4 rounded-2xl">
                    <h3 class="text-amber-300 text-xs font-black mb-2">目前房間玩家 (<span id="room-player-count">0</span>/4)：</h3>
                    <div id="room-players-list" class="space-y-1 text-xs text-white">載入中...</div>
                </div>

                <button id="start-online-btn" onclick="startOnlineGame()" class="hidden w-full bg-gradient-to-r from-red-600 to-orange-600 text-white font-black py-3 rounded-2xl text-base shadow-lg animate-pulse">
                    房主開始對局！
                </button>
                <button onclick="leaveRoom()" class="w-full bg-slate-800 text-slate-300 font-bold py-2 rounded-xl text-xs">離開房間</button>
            </div>
        </div>

        <!-- 滿版 4 人麻將對戰桌介面 -->
        <div id="game-view" class="hidden flex-1 relative p-1 sm:p-3 flex flex-col justify-between select-none overflow-hidden bg-emerald-800">
            <!-- 上方對手 -->
            <div class="flex flex-col items-center z-20 mt-1">
                <div id="avatar-box-2" class="flex items-center space-x-3 bg-slate-900/95 px-4 py-1.5 rounded-3xl border-3 border-amber-400 shadow-2xl relative">
                    <div class="avatar-box-giant"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="對家"></div>
                    <div class="text-sm font-black text-amber-300">
                        <div id="player-name-2" class="text-xs sm:text-lg text-white">對家</div>
                        <div id="arrow-2" class="hidden bg-red-600 text-white px-2 py-0.5 rounded text-[10px]">⬇️ 換伊</div>
                    </div>
                </div>
                <div id="ai-top-tiles" class="flex space-x-1 mt-1"></div>
            </div>

            <!-- 左右對手與中央牌河 -->
            <div class="flex justify-between items-center my-auto px-1 z-10">
                <div id="avatar-box-3" class="flex flex-col items-center bg-slate-900/95 p-2 rounded-2xl border-3 border-amber-400 shadow-2xl">
                    <div class="avatar-box-giant mb-1"><img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=300&q=80" alt="上家"></div>
                    <span id="player-name-3" class="text-white text-xs font-black">上家</span>
                    <div id="arrow-3" class="hidden bg-red-600 text-white px-1 rounded text-[10px]">➡️</div>
                </div>

                <div class="bg-slate-950/85 p-2 rounded-2xl text-center shadow-2xl w-full max-w-3xl mx-1 flex flex-col items-center border-2 border-amber-500/50">
                    <div class="flex justify-between w-full text-amber-300 text-xs font-black mb-1">
                        <span id="table-stakes-info">對戰桌</span>
                        <span>剩牌: <span id="tiles-left" class="text-white">56</span>張</span>
                    </div>
                    <div class="text-sm sm:text-lg font-black text-amber-200 my-0.5 animate-pulse" id="game-status-text">牌局開始！</div>
                    <div class="w-full bg-slate-900/90 h-32 rounded-xl p-2 border border-amber-500/40 flex flex-wrap gap-1.5 justify-center items-start overflow-y-auto" id="discards-river">
                        <span class="text-[11px] text-slate-400">尚無打出之牌</span>
                    </div>
                </div>

                <div id="avatar-box-1" class="flex flex-col items-center bg-slate-900/95 p-2 rounded-2xl border-3 border-amber-400 shadow-2xl">
                    <div class="avatar-box-giant mb-1"><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=300&q=80" alt="下家"></div>
                    <span id="player-name-1" class="text-white text-xs font-black">下家</span>
                    <div id="arrow-1" class="hidden bg-red-600 text-white px-1 rounded text-[10px]">⬅️</div>
                </div>
            </div>

            <!-- 吃碰槓動作按鈕區 -->
            <div id="action-buttons-container" class="absolute bottom-36 left-1/2 transform -translate-x-1/2 flex space-x-2 z-30"></div>

            <!-- 下方玩家手牌區 -->
            <div id="avatar-box-0" class="p-2 rounded-2xl shadow-2xl z-20 relative flex flex-col sm:flex-row items-center justify-between border-2 border-amber-500/50 bg-slate-950/95 w-full gap-2">
                <div class="flex items-center space-x-2 bg-slate-900 px-3 py-1.5 rounded-xl border border-amber-400">
                    <div class="avatar-player-box"><img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80" alt="玩家"></div>
                    <div>
                        <div class="text-amber-300 text-xs font-black"><span id="player-nickname-display" class="text-white">玩家</span></div>
                        <div id="arrow-0" class="hidden bg-red-600 text-white px-1.5 py-0.5 rounded text-[10px] animate-pulse">⬆️ 換你出牌</div>
                    </div>
                </div>
                <div id="player-tiles" class="flex items-center justify-start sm:justify-center flex-1 w-full overflow-x-auto py-1 px-1 gap-1"></div>
                <div class="flex space-x-2 shrink-0">
                    <button id="draw-btn" onclick="playerDrawAndPlay()" class="bg-amber-500 text-slate-950 px-4 py-2 rounded-xl font-black text-xs shadow animate-pulse">摸牌/出牌</button>
                    <button onclick="playerDeclareWin()" class="bg-red-600 text-white px-4 py-2 rounded-xl font-black text-xs shadow">胡矣！</button>
                    <button onclick="leaveTable()" class="bg-slate-800 text-slate-300 text-xs font-black px-3 py-2 rounded-xl">大廳</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs & 遊戲核心 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import MahjongEngine from "./script.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDVY6He4UylPQTNbrqMeF2IjBuxuINAGbs",
            authDomain: "starmahjong3.firebaseapp.com",
            projectId: "starmahjong3",
            storageBucket: "starmahjong3.firebasestorage.app",
            messagingSenderId: "67800368789",
            appId: "1:67800368789:web:a8665a8282dd7470d5bd9c",
            measurementId: "G-7BP46L04JY"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        const mahjongGame = new MahjongEngine();
        let currentUser = null;
        let isRegisterMode = false;
        let gameMode = 'ai';
        let currentRoomCode = null;
        let mySeatIndex = 0;
        let roomData = null;
        let unsubscribeRoom = null;
        let hasDrawnThisTurn = false;
        let currentTurnPlayer = 0;
        let userData = { nickname: "麻將新手", chips: 100000 };

        window.toggleAuthMode = function() {
            isRegisterMode = !isRegisterMode;
            document.getElementById("nickname-field").classList.toggle("hidden", !isRegisterMode);
            document.getElementById("auth-submit-btn").textContent = isRegisterMode ? "註冊帳號並進入" : "登入遊戲大廳";
        };

        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("login-email").value;
            const pass = document.getElementById("login-password").value;
            const errDiv = document.getElementById("login-error");
            errDiv.classList.add("hidden");
            try {
                if (isRegisterMode) {
                    const nick = document.getElementById("reg-nickname").value.trim() || "玩家";
                    const cred = await createUserWithEmailAndPassword(auth, email, pass);
                    await set(ref(database, `users/${cred.user.uid}`), { nickname: nick, chips: 100000 });
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                }
            } catch (err) {
                errDiv.textContent = "失敗: " + err.message;
                errDiv.classList.remove("hidden");
            }
        });

        window.logoutUser = function() { signOut(auth); };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById("login-screen").classList.add("hidden");
                document.getElementById("app-screen").classList.remove("hidden");
                const snap = await get(ref(database, `users/${user.uid}`));
                if (snap.exists()) userData = snap.val();
                updateUI();
            } else {
                currentUser = null;
                document.getElementById("login-screen").classList.remove("hidden");
                document.getElementById("app-screen").classList.add("hidden");
                if (unsubscribeRoom) unsubscribeRoom();
            }
        });

        function updateUI() {
            document.getElementById("header-nickname").textContent = userData.nickname;
            document.getElementById("player-nickname-display").textContent = userData.nickname;
            document.getElementById("header-chips").textContent = (userData.chips || 100000).toLocaleString();
        }

        window.openTableSelect = function(mode) {
            gameMode = mode;
            document.getElementById("lobby-mode-view").classList.add("hidden");
            document.getElementById("ai-table-view").classList.remove("hidden");
        };

        window.openRoomLobby = function() {
            gameMode = 'online';
            document.getElementById("lobby-mode-view").classList.add("hidden");
            document.getElementById("online-room-view").classList.remove("hidden");
            document.getElementById("room-action-panel").classList.remove("hidden");
            document.getElementById("room-waiting-panel").classList.add("hidden");
        };

        window.backToModeSelect = function() {
            if (unsubscribeRoom) { unsubscribeRoom(); unsubscribeRoom = null; }
            document.getElementById("ai-table-view").classList.add("hidden");
            document.getElementById("online-room-view").classList.add("hidden");
            document.getElementById("game-view").classList.add("hidden");
            document.getElementById("lobby-mode-view").classList.remove("hidden");
        };

        // --- 電腦對戰模式 ---
        window.startAiTable = function(base, tai) {
            gameMode = 'ai';
            document.getElementById("ai-table-view").classList.add("hidden");
            document.getElementById("game-view").classList.remove("hidden");
            document.getElementById("table-stakes-info").textContent = `電腦桌: ${base}/${tai}`;
            document.getElementById("player-name-1").textContent = "下家大飛";
            document.getElementById("player-name-2").textContent = "對家阿強";
            document.getElementById("player-name-3").textContent = "上家小莉";

            mahjongGame.deal();
            hasDrawnThisTurn = false;
            currentTurnPlayer = 0;
            renderGameTable();
        };

        // --- 邀請碼房間邏輯 ---
        window.createRoom = async function() {
            const code = Math.floor(100000 + Math.random() * 900000).toString();
            currentRoomCode = code;
            const roomRef = ref(database, `rooms/${code}`);
            
            const newRoom = {
                status: 'waiting',
                host: currentUser.uid,
                players: {}
            };
            newRoom.players[currentUser.uid] = { nickname: userData.nickname, seat: 0 };
            await set(roomRef, newRoom);
            
            enterWaitingRoom(code);
        };

        window.joinRoomByCode = async function() {
            const code = document.getElementById("join-code-input").value.trim();
            if (code.length !== 6) {
                alert("請輸入正確的 6 位數邀請碼！");
                return;
            }
            const roomRef = ref(database, `rooms/${code}`);
            const snap = await get(roomRef);
            if (!snap.exists()) {
                alert("找不到此房間，請確認邀請碼是否正確！");
                return;
            }

            const room = snap.val();
            const players = room.players || {};
            const existingSeats = Object.values(players).map(p => p.seat);
            
            if (Object.keys(players).length >= 4 && !players[currentUser.uid]) {
                alert("房間已滿（4人）！");
                return;
            }

            currentRoomCode = code;
            if (!players[currentUser.uid]) {
                let assignedSeat = 0;
                for (let s = 0; s < 4; s++) {
                    if (!existingSeats.includes(s)) { assignedSeat = s; break; }
                }
                players[currentUser.uid] = { nickname: userData.nickname, seat: assignedSeat };
                await update(roomRef, { players });
            }

            enterWaitingRoom(code);
        };

        function enterWaitingRoom(code) {
            document.getElementById("room-action-panel").classList.add("hidden");
            document.getElementById("room-waiting-panel").classList.remove("hidden");
            document.getElementById("display-invite-code").textContent = code;
            listenToRoom(code);
        }

        function listenToRoom(code) {
            if (unsubscribeRoom) unsubscribeRoom();
            const roomRef = ref(database, `rooms/${code}`);
            unsubscribeRoom = onValue(roomRef, (snap) => {
                const room = snap.val();
                if (!room) return;
                roomData = room;
                updateRoomUI();

                if (room.status === 'playing' && room.gameState) {
                    syncOnlineGameState(room.gameState);
                }
            });
        }

        function updateRoomUI() {
            if (!roomData || !roomData.players) return;
            const playersArr = Object.entries(roomData.players);
            document.getElementById("room-player-count").textContent = playersArr.length;
            document.getElementById("room-players-list").innerHTML = playersArr.map(([uid, p]) => `<div>座位 ${p.seat + 1}: ${p.nickname} ${uid === currentUser.uid ? '(你自己)' : ''}</div>`).join('');
            
            const isHost = roomData.host === currentUser.uid;
            const startBtn = document.getElementById("start-online-btn");
            if (isHost && playersArr.length >= 1) { // 測試時 1 人即可，正式可改 players.length === 4
                startBtn.classList.remove("hidden");
            } else {
                startBtn.classList.add("hidden");
            }
        }

        window.startOnlineGame = async function() {
            const roomRef = ref(database, `rooms/${currentRoomCode}`);
            mahjongGame.deal();
            const initialState = {
                deck: mahjongGame.deck,
                players: mahjongGame.players,
                discards: mahjongGame.discards,
                currentTurn: 0,
                status: 'playing'
            };
            await update(roomRef, { status: 'playing', gameState: initialState });
        };

        window.leaveRoom = function() {
            if (unsubscribeRoom) { unsubscribeRoom(); unsubscribeRoom = null; }
            openRoomLobby();
        };

        function syncOnlineGameState(state) {
            document.getElementById("online-room-view").classList.add("hidden");
            document.getElementById("game-view").classList.remove("hidden");
            document.getElementById("table-stakes-info").textContent = `線上邀請房 (${currentRoomCode})`;

            const pEntries = Object.entries(roomData.players);
            const myEntry = pEntries.find(([uid]) => uid === currentUser.uid);
            mySeatIndex = myEntry ? myEntry[1].seat : 0;

            mahjongGame.deck = state.deck;
            mahjongGame.players = state.players;
            mahjongGame.discards = state.discards;
            currentTurnPlayer = state.currentTurn;

            pEntries.forEach(([uid, p]) => {
                const relSeat = (p.seat - mySeatIndex + 4) % 4;
                if (relSeat > 0) {
                    document.getElementById(`player-name-${relSeat}`).textContent = p.nickname;
                }
            });

            renderGameTable();
        }

        // --- 牌局與共用渲染 ---
        function renderGameTable() {
            const container = document.getElementById("player-tiles");
            container.innerHTML = "";
            const playerHand = mahjongGame.players[mySeatIndex];

            playerHand.forEach((t, idx) => {
                const tileDiv = document.createElement("div");
                tileDiv.className = "mahjong-tile-real";
                tileDiv.innerHTML = createTileHtml(t);
                tileDiv.onclick = () => playerDiscardTile(idx);
                container.appendChild(tileDiv);
            });

            const topSeat = (mySeatIndex + 2) % 4;
            document.getElementById("ai-top-tiles").innerHTML = mahjongGame.players[topSeat].map(() => `<div class="w-4 h-6 bg-amber-100 rounded border border-slate-400"></div>`).join('');
            document.getElementById("tiles-left").textContent = mahjongGame.deck.length;

            updateTurnIndicator();
        }

        function createTileHtml(code) {
            const num = code[0], type = code[1];
            if (type === 'm') {
                const chineseNums = {'1':'一','2':'二','3':'三','4':'四','5':'五','6':'六','7':'七','8':'八','9':'九'};
                return `<span class="tile-number tile-red">${chineseNums[num] || num}</span><span class="tile-suit tile-red">萬</span>`;
            } else if (type === 'p') {
                return `<div class="mahjong-dot-container"><div class="m-dot"></div></div><span class="tile-suit tile-blue" style="font-size:0.55rem;">${num}筒</span>`;
            } else if (type === 's') {
                return `<div class="mahjong-bamboo-container"><div class="m-stick"></div></div><span class="tile-suit tile-green" style="font-size:0.55rem;">${num}條</span>`;
            } else if (type === 'z') {
                if (num === '7') return `<div class="mahjong-white-board"></div>`;
                const winds = ['東', '南', '西', '北', '中', '發', '白'];
                return `<span class="tile-number tile-dark">${winds[parseInt(num) - 1]}</span>`;
            }
            return `<span class="tile-number">${code}</span>`;
        }

        window.playerDrawAndPlay = function() {
            if (currentTurnPlayer !== mySeatIndex) return;
            if (hasDrawnThisTurn) return;
            const drawn = mahjongGame.drawTile(mySeatIndex);
            if (!drawn) { alert("流局！"); leaveTable(); return; }
            hasDrawnThisTurn = true;
            mahjongGame.sortHand(mahjongGame.players[mySeatIndex]);
            renderGameTable();
        };

        function playerDiscardTile(index) {
            if (currentTurnPlayer !== mySeatIndex || !hasDrawnThisTurn) {
                alert("還沒輪到您或尚未摸牌！"); return;
            }
            const playerHand = mahjongGame.players[mySeatIndex];
            const discarded = playerHand.splice(index, 1)[0];
            mahjongGame.sortHand(playerHand);
            mahjongGame.discards[mySeatIndex].push(discarded);
            
            hasDrawnThisTurn = false;
            currentTurnPlayer = (currentTurnPlayer + 1) % 4;

            if (gameMode === 'online') {
                update(ref(database, `rooms/${currentRoomCode}/gameState`), {
                    deck: mahjongGame.deck,
                    players: mahjongGame.players,
                    discards: mahjongGame.discards,
                    currentTurn: currentTurnPlayer
                });
            } else {
                renderGameTable();
                setTimeout(() => aiTurnAction(currentTurnPlayer), 1000);
            }
        }

        function aiTurnAction(aiIdx) {
            currentTurnPlayer = aiIdx;
            const aiHand = mahjongGame.players[aiIdx];
            if (aiHand && aiHand.length > 0) {
                const aiDisc = aiHand.pop();
                mahjongGame.discards[aiIdx].push(aiDisc);
                currentTurnPlayer = (aiIdx + 1) % 4;
                renderGameTable();
                if (currentTurnPlayer !== 0) {
                    setTimeout(() => aiTurnAction(currentTurnPlayer), 1000);
                }
            }
        }

        window.playerDeclareWin = function() {
            alert("🎉 恭喜胡牌！");
            leaveTable();
        };

        window.leaveTable = function() {
            document.getElementById("game-view").classList.add("hidden");
            document.getElementById("lobby-mode-view").classList.remove("hidden");
        };

        function updateTurnIndicator() {
            for (let i = 0; i <= 3; i++) {
                const relSeat = (i - mySeatIndex + 4) % 4;
                const box = document.getElementById(`avatar-box-${relSeat}`);
                const arrow = document.getElementById(`arrow-${relSeat}`);
                if (box && arrow) {
                    if (i === currentTurnPlayer) {
                        box.classList.add("turn-active-glow");
                        arrow.classList.remove("hidden");
                    } else {
                        box.classList.remove("turn-active-glow");
                        arrow.classList.add("hidden");
                    }
                }
            }
        }
    </script>
</body>
</html>
