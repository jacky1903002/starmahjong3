<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>明星三缺一 - 網頁麻將大對決</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Cute & Rounded -->
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
    <!-- 外部樣式檔 -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-emerald-600 via-teal-700 to-cyan-900 min-h-screen text-slate-900 flex flex-col items-center justify-center p-2 sm:p-4">

    <!-- 登入與註冊畫面 -->
    <div id="login-screen" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div class="bg-white/95 p-8 rounded-3xl shadow-2xl w-full max-w-md border-4 border-amber-400 relative overflow-hidden">
            <div class="absolute -top-10 -right-10 bg-amber-400 text-amber-900 w-32 h-32 rounded-full flex items-end justify-start p-6 text-2xl font-black rotate-12 shadow-inner">麻將王</div>
            <div class="text-center mb-6">
                <div class="bg-gradient-to-r from-amber-500 to-orange-500 text-white w-20 h-20 rounded-2xl flex items-center justify-center mx-auto mb-3 text-4xl shadow-lg shadow-orange-500/40 animate-bounce">
                    <i class="fa-solid fa-dice-one"></i>
                </div>
                <h2 class="text-3xl font-black text-slate-900 tracking-tight">明星三缺一網頁版</h2>
                <p class="text-sm text-slate-500 mt-1 font-bold">快樂麻將，隨時開桌！</p>
            </div>
            <form id="login-form" class="space-y-4">
                <div id="nickname-field" class="hidden">
                    <label class="block text-xs font-black text-slate-700 mb-1 uppercase tracking-wider">遊戲玩家綽號 (Nickname)</label>
                    <input type="text" id="reg-nickname" class="w-full px-4 py-3 border-2 border-slate-300 rounded-2xl focus:ring-4 focus:ring-amber-400 focus:outline-none font-bold text-slate-900" placeholder="例如：賭神高進">
                </div>
                <div>
                    <label class="block text-xs font-black text-slate-700 mb-1 uppercase tracking-wider">電子郵件 (Email)</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-3 border-2 border-slate-300 rounded-2xl focus:ring-4 focus:ring-amber-400 focus:outline-none font-bold text-slate-900" placeholder="player@mahjong.com">
                </div>
                <div>
                    <label class="block text-xs font-black text-slate-700 mb-1 uppercase tracking-wider">密碼 (Password)</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-3 border-2 border-slate-300 rounded-2xl focus:ring-4 focus:ring-amber-400 focus:outline-none font-bold text-slate-900" placeholder="••••••••">
                </div>
                <div id="login-error" class="text-red-600 text-xs font-bold text-center hidden"></div>
                
                <button type="submit" id="auth-submit-btn" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-black py-3.5 rounded-2xl transition duration-200 shadow-lg shadow-orange-500/40 text-lg">
                    登入遊戲大廳
                </button>
                <div class="text-center pt-2">
                    <button type="button" onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-xs font-bold text-teal-700 hover:underline">
                        沒有帳號？點此註冊新帳號與綽號
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 主遊戲大廳與牌桌介面 (支援全螢幕) -->
    <div id="app-screen" class="hidden flex flex-col w-full max-w-7xl h-[95vh] bg-slate-900/95 rounded-3xl shadow-2xl border-4 border-amber-500/60 overflow-hidden backdrop-blur-xl">
        
        <!-- 頂端資訊導覽列 -->
        <header class="bg-slate-950 px-6 py-3 flex flex-wrap justify-between items-center gap-4 border-b-2 border-amber-500/40 text-white shrink-0">
            <div class="flex items-center space-x-3">
                <div class="bg-amber-500 text-slate-950 w-10 h-10 rounded-xl flex items-center justify-center text-xl font-black shadow-md">麻</div>
                <div>
                    <h1 class="text-lg font-black text-amber-400 tracking-wider">明星三缺一 | 頂級對決</h1>
                    <p class="text-[10px] text-slate-400 font-bold">玩家: <span id="header-nickname" class="text-white">載入中...</span></p>

            <!-- 籌碼與聲音開關 -->

            <!-- 功能按鈕群 -->

                <button onclick="openModal('badge-modal')" class="bg-purple-600 hover:bg-purple-700 text-white px-3.5 py-2 rounded-xl transition font-black shadow-md flex items-center">

            <div class="flex items-center space-x-2">
                <span id="conn-dot" class="w-2.5 h-2.5 rounded-full bg-slate-500 inline-block"></span>

        <!-- 遊戲大廳 / 選擇底台區 -->
        <div id="lobby-view" class="flex-1 p-8 flex flex-col items-center justify-center space-y-8 overflow-y-auto">
            <div class="text-center space-y-2">
                <h2 class="text-4xl font-black text-amber-400 drop-shadow-md">請選擇對戰底台</h2>
                <p class="text-sm text-slate-300 font-bold">每日 00:00 自動補發 100,000 籌碼！輸光也不怕！</p>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 w-full max-w-4xl">
                <button onclick="startTable(50, 20)" class="bg-gradient-to-b from-teal-500 to-teal-700 hover:from-teal-400 hover:to-teal-600 p-6 rounded-3xl shadow-xl border-4 border-teal-300 text-white text-center transform hover:-translate-y-1 transition duration-200">
                    <div class="text-2xl font-black mb-1">新手練習桌</div>
                    <div class="text-3xl font-black text-amber-300 my-2">50 / 20 台</div>

                </button>
                <button onclick="startTable(100, 30)" class="bg-gradient-to-b from-blue-600 to-blue-800 hover:from-blue-500 hover:to-blue-700 p-6 rounded-3xl shadow-xl border-4 border-blue-300 text-white text-center transform hover:-translate-y-1 transition duration-200">
                    <div class="text-2xl font-black mb-1">高手進階桌</div>
                    <div class="text-3xl font-black text-amber-300 my-2">100 / 30 台</div>
                    <div class="text-xs opacity-80">刺激對決人氣首選</div>
                </button>
                <button onclick="startTable(300, 100)" class="bg-gradient-to-b from-purple-600 to-purple-800 hover:from-purple-500 hover:to-purple-700 p-6 rounded-3xl shadow-xl border-4 border-purple-300 text-white text-center transform hover:-translate-y-1 transition duration-200">
                    <div class="text-2xl font-black mb-1">土豪大亨桌</div>
                    <div class="text-3xl font-black text-amber-300 my-2">300 / 100 台</div>
                    <div class="text-xs opacity-80">高風險高報酬</div>
                </button>
                <button onclick="startTable(500, 100)" class="bg-gradient-to-b from-amber-600 to-orange-700 hover:from-amber-500 hover:to-orange-600 p-6 rounded-3xl shadow-xl border-4 border-amber-300 text-white text-center transform hover:-translate-y-1 transition duration-200">
                    <div class="text-2xl font-black mb-1">至尊賭神桌</div>
                    <div class="text-3xl font-black text-yellow-300 my-2">500 / 100 台</div>
                    <div class="text-xs opacity-80">頂尖高手決戰之地</div>
                </button>
            </div>
        </div>

        <!-- 模擬四方麻將桌對戰介面 (包含真人頭貼、對話框、桌面牌河) -->
        <div id="game-view" class="hidden flex-1 relative p-4 flex flex-col justify-between select-none table-felt-bg overflow-hidden">
            
            <!-- 上方對手 (對家) 與頭貼對話框 -->
            <div class="flex flex-col items-center z-20">
                <div class="flex items-center space-x-3 bg-slate-900/90 px-4 py-1.5 rounded-2xl border border-amber-500/40 shadow-lg">
                    <div class="relative">
                        <div class="w-10 h-10 rounded-full bg-blue-600 border-2 border-amber-400 flex items-center justify-center text-white font-black text-sm avatar-float">👦</div>
                        <div id="ai-top-speech" class="absolute -bottom-8 left-1/2 transform -translate-x-1/2 bg-white text-slate-900 text-[10px] font-black px-2 py-0.5 rounded-lg shadow whitespace-nowrap hidden">摸一張好牌！</div>
                    </div>
                    <div class="text-xs font-black text-amber-300">
                        <div>對家 (AI 雀豪)</div>
                        <div class="text-[10px] text-slate-300">籌碼: <span class="text-white">98,000</span></div>
                    </div>
                </div>
                <div id="ai-top-tiles" class="flex space-x-1 mt-1"></div>
            </div>

            <!-- 左右對手與中央牌河區 -->
            <div class="flex justify-between items-center my-auto px-2 z-10">
                <!-- 左方對手 (上家) -->
                <div class="flex flex-col items-center bg-slate-900/90 p-3 rounded-2xl border border-amber-500/40 shadow-lg relative">
                    <div class="w-10 h-10 rounded-full bg-pink-600 border-2 border-amber-400 flex items-center justify-center text-white font-black text-sm mb-1 avatar-float">👧</div>
                    <div id="ai-left-speech" class="absolute left-12 top-2 bg-white text-slate-900 text-[10px] font-black px-2 py-0.5 rounded-lg shadow whitespace-nowrap hidden">碰！</div>
                    <span class="text-white text-xs font-black">上家 AI</span>
                    <span class="text-[10px] text-slate-300">105,000</span>
                </div>

                <!-- 中央牌桌資訊與牌河 (Discards River) -->
                <div class="glass-panel p-4 rounded-3xl text-center shadow-2xl max-w-lg w-full mx-2 flex flex-col items-center">
                    <div class="flex justify-between w-full text-amber-400 text-xs font-black mb-1">
                        <span id="table-stakes-info">底台: 100 / 30</span>
                        <span>剩餘牌數: <span id="tiles-left" class="text-white font-black">56</span> 張</span>
                    </div>
                    <div class="text-xl font-black text-white my-1" id="game-status-text">局勢進行中... 請出牌或摸牌</div>
                    <!-- 桌面牌河展示區 -->
                    <div class="w-full bg-slate-950/60 h-20 rounded-2xl p-2 border border-amber-500/30 overflow-y-auto flex flex-wrap gap-1 justify-center items-center" id="discards-river">
                        <span class="text-[11px] text-slate-500 font-bold">牌河尚無打出之牌</span>
                    </div>
                </div>

                <!-- 右方對手 (下家) -->
                <div class="flex flex-col items-center bg-slate-900/90 p-3 rounded-2xl border border-amber-500/40 shadow-lg relative">
                    <div class="w-10 h-10 rounded-full bg-purple-600 border-2 border-amber-400 flex items-center justify-center text-white font-black text-sm mb-1 avatar-float">👨</div>
                    <div id="ai-right-speech" class="absolute right-12 top-2 bg-white text-slate-900 text-[10px] font-black px-2 py-0.5 rounded-lg shadow whitespace-nowrap hidden">小心我聽牌囉！</div>
                    <span class="text-white text-xs font-black">下家 AI</span>
                    <span class="text-[10px] text-slate-300">92,000</span>
                </div>
            </div>

            <!-- 卡牌跳躍互動按鈕區 (吃、碰、槓、聽、胡) -->
            <div id="action-buttons-container" class="absolute bottom-36 left-1/2 transform -translate-x-1/2 flex space-x-3 z-30">
                <!-- 動態按鈕 -->
            </div>

            <!-- 下方玩家手牌區與個人頭貼 -->
            <div class="glass-panel p-4 rounded-3xl shadow-2xl z-20 relative">
                <div class="flex justify-between items-center mb-2 px-1">
                    <div class="flex items-center space-x-2">
                        <div class="w-8 h-8 rounded-full bg-amber-500 text-slate-950 font-black flex items-center justify-center text-xs border-2 border-white">👑</div>
                        <span class="text-amber-300 text-xs font-black">玩家: <span id="player-nickname-display" class="text-white">玩家</span></span>
                    </div>
                    <button onclick="leaveTable()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-black px-3 py-1 rounded-xl transition">返回大廳</button>
                </div>
                <!-- 玩家手牌 -->
                <div id="player-tiles" class="flex space-x-1.5 overflow-x-auto py-2 justify-center">
                    <!-- 動態渲染手牌 -->
                </div>
                <div class="mt-2 flex justify-center space-x-3">
                    <button onclick="playerDrawAndPlay()" class="btn-star-gold px-6 py-2 rounded-2xl font-black text-sm transition">
                        摸牌 / 出牌
                    </button>
                    <button onclick="playerDeclareWin()" class="btn-star-red px-6 py-2 rounded-2xl font-black text-sm transition win-text-glow">
                        自摸 / 胡牌！
                    </button>
                </div>
            </div>

        </div>

    </div>

    <!-- 排行榜 Modal -->
    <div id="ranking-modal" class="fixed inset-0 bg-slate-950/80 hidden items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white p-6 rounded-3xl shadow-2xl w-full max-w-lg border-4 border-amber-400">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="text-xl font-black text-slate-900 flex items-center"><i class="fa-solid fa-trophy text-amber-500 mr-2"></i>全伺服器富豪排行榜</h3>
                <button onclick="closeModal('ranking-modal')" class="text-slate-400 hover:text-slate-700 font-black text-lg">✕</button>
            </div>
            <div id="ranking-list" class="space-y-2 max-h-80 overflow-y-auto"></div>
        </div>
    </div>

    <!-- 成就徽章 Modal -->
    <div id="badge-modal" class="fixed inset-0 bg-slate-950/80 hidden items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white p-6 rounded-3xl shadow-2xl w-full max-w-lg border-4 border-purple-400">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="text-xl font-black text-slate-900 flex items-center"><i class="fa-solid fa-medal text-purple-600 mr-2"></i>我的成就徽章</h3>
                <button onclick="closeModal('badge-modal')" class="text-slate-400 hover:text-slate-700 font-black text-lg">✕</button>
            </div>
            <div class="grid grid-cols-2 gap-4" id="badge-grid"></div>
        </div>
    </div>

    <!-- Firebase SDKs & 完整遊戲邏輯與音效引擎 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import MahjongEngine from "./script.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDVY6He4UylPQTNbrqMeF2IjBuxuINAGbs",
            authDomain: "starmahjong3.firebaseapp.com",
            projectId: "starmahjong3",
            storageBucket: "starmahjong3.firebasestorage.app",
            messagingSenderId: "67800368789",
            appId: "1:67800368789:web:a8665a8282dd7470d5bd9c",
            measurementId: "G-7BP46L04JY"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        const mahjongGame = new MahjongEngine();
        let currentUser = null;
        let isRegisterMode = false;
        let soundEnabled = true;
        let userData = {
            nickname: "麻將大老千",
            chips: 100000,
            lastLoginDate: "",
            winCount: 0,
            loginCount: 0,
            selfDrawCount: 0
        };

        // --- 網頁音效合成系統 (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (!soundEnabled) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start(); osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'action') { // 吃、碰、槓
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'win') { // 胡牌勝利
                const now = audioCtx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.frequency.value = freq;
                    g.gain.setValueAtTime(0.15, now + idx * 0.1);
                    g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.3);
                    o.start(now + idx * 0.1); o.stop(now + idx * 0.1 + 0.3);
                });
            }
        }

        window.toggleAudio = function() {
            soundEnabled = !soundEnabled;
            document.getElementById("audio-toggle-btn").innerHTML = `<i class="fa-solid fa-volume-${soundEnabled ? 'high' : 'xmark'} mr-1"></i>音效: ${soundEnabled ? '開' : '關'}`;
        };

        window.toggleFullScreen = function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => alert("全螢幕請求失敗: " + err.message));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        };

        // 連線狀態監控
        const connectedRef = ref(database, ".info/connected");
        onValue(connectedRef, (snap) => {
            const dot = document.getElementById("conn-dot");
            const text = document.getElementById("conn-text");
            if (snap.val() === true) {
                dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block animate-pulse";
                text.textContent = "已連線至 Firebase Realtime Database";
            } else {
                dot.className = "w-2.5 h-2.5 rounded-full bg-red-500 inline-block";
                text.textContent = "連線中斷 / 離線";
            }
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById("login-screen").classList.add("hidden");
                document.getElementById("app-screen").classList.remove("hidden");
                await loadUserData(user.uid);
            } else {
                currentUser = null;
                document.getElementById("login-screen").classList.remove("hidden");
                document.getElementById("app-screen").classList.add("hidden");
            }
        });

        window.toggleAuthMode = function() {
            isRegisterMode = !isRegisterMode;
            const nickField = document.getElementById("nickname-field");
            const submitBtn = document.getElementById("auth-submit-btn");
            const toggleBtn = document.getElementById("auth-toggle-btn");
            if (isRegisterMode) {
                nickField.classList.remove("hidden");
                submitBtn.textContent = "註冊帳號並進入遊戲";
                toggleBtn.textContent = "已有帳號？點此登入";
            } else {
                nickField.classList.add("hidden");
                submitBtn.textContent = "登入遊戲大廳";
                toggleBtn.textContent = "沒有帳號？點此註冊新帳號與綽號";
            }
        };

        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            playSound('click');
            const email = document.getElementById("login-email").value;
            const pass = document.getElementById("login-password").value;
            const errDiv = document.getElementById("login-error");
            errDiv.classList.add("hidden");

            try {
                if (isRegisterMode) {
                    const nickname = document.getElementById("reg-nickname").value.trim() || "麻將新手";
                    const cred = await createUserWithEmailAndPassword(auth, email, pass);
                    const todayStr = new Date().toISOString().split('T')[0];
                    const initialData = {
                        nickname: nickname,
                        chips: 100000,
                        lastLoginDate: todayStr,
                        winCount: 0,
                        loginCount: 1,
                        selfDrawCount: 0
                    };
                    await set(ref(database, `users/${cred.user.uid}`), initialData);
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                }
            } catch (err) {
                errDiv.textContent = "操作失敗: " + err.message;
                errDiv.classList.remove("hidden");
            }
        });

        window.logoutUser = function() {
            playSound('click');
            signOut(auth);
        };

        async function loadUserData(uid) {
            const userRef = ref(database, `users/${uid}`);
            const snap = await get(userRef);
            const todayStr = new Date().toISOString().split('T')[0];

            if (snap.exists()) {
                userData = snap.val();
                userData.loginCount = (userData.loginCount || 0) + 1;
                if (userData.lastLoginDate !== todayStr) {
                    userData.chips = (userData.chips || 0) + 100000;
                    userData.lastLoginDate = todayStr;
                    alert("新的一天開始！系統已自動為您補充 100,000 籌碼！");
                }
            } else {
                userData = {
                    nickname: currentUser.email.split('@')[0],
                    chips: 100000,
                    lastLoginDate: todayStr,
                    winCount: 0,
                    loginCount: 1,
                    selfDrawCount: 0
                };
            }
            await set(userRef, userData);
            updateUI();
            updateLastSavedTime();
        }

        function updateUI() {
            document.getElementById("header-nickname").textContent = userData.nickname;
            document.getElementById("player-nickname-display").textContent = userData.nickname;
            document.getElementById("header-chips").textContent = userData.chips.toLocaleString();
        }

        function updateLastSavedTime() {
            document.getElementById("last-saved-time").textContent = new Date().toLocaleTimeString();
        }

        // --- 遊戲對戰與麻將核心邏輯聯動 ---
        let currentStakes = { base: 100, tai: 30 };

        window.startTable = function(base, tai) {
            playSound('click');
            if (userData.chips < base * 10) {
                alert("您的籌碼不足以進入此桌！請等待明天 00:00 自動補幣。");
                return;
            }
            currentStakes = { base, tai };
            document.getElementById("lobby-view").classList.add("hidden");
            document.getElementById("game-view").classList.remove("hidden");
            document.getElementById("table-stakes-info").textContent = `底台: ${base} / ${tai}`;

            mahjongGame.deal();
            renderGameTable();
        };

        window.leaveTable = function() {
            playSound('click');
            document.getElementById("game-view").classList.add("hidden");
            document.getElementById("lobby-view").classList.remove("hidden");
            saveUserDataToFirebase();
        };

        function renderGameTable() {
            const container = document.getElementById("player-tiles");
            container.innerHTML = "";
            const playerHand = mahjongGame.players[0];

            playerHand.forEach((t, idx) => {
                const tileDiv = document.createElement("div");
                tileDiv.className = "w-9 h-13 sm:w-11 sm:h-16 mahjong-tile rounded-xl flex items-center justify-center text-xs sm:text-sm font-black text-slate-900 cursor-pointer shadow-md";
                tileDiv.textContent = formatTileName(t);
                tileDiv.onclick = () => playerDiscardTile(idx);
                container.appendChild(tileDiv);
            });

            // 渲染上方 AI 對手牌數
            document.getElementById("ai-top-tiles").innerHTML = mahjongGame.players[2].map(() => `<div class="w-5 h-7 bg-amber-100 rounded border border-slate-400 shadow"></div>`).join('');
            document.getElementById("tiles-left").textContent = mahjongGame.deck.length;

            // 檢查聽牌與胡牌判定
            checkPlayerActions();
        }

        function formatTileName(code) {
            const num = code[0];
            const type = code[1];
            if (type === 'm') return num + '萬';
            if (type === 'p') return num + '筒';
            if (type === 's') return num + '條';
            if (type === 'z') {
                const winds = ['東', '南', '西', '北', '中', '發', '白'];
                return winds[parseInt(num) - 1];
            }
            return code;
        }

        // 玩家摸牌與出牌
        window.playerDrawAndPlay = function() {
            playSound('click');
            const drawn = mahjongGame.drawTile(0);
            if (!drawn) {
                alert("牌局已流局！");
                leaveTable();
                return;
            }
            document.getElementById("game-status-text").textContent = `摸了一張【${formatTileName(drawn)}】，請點擊手牌打出一張`;
            renderGameTable();
        };

        // 玩家點擊手牌打出
        function playerDiscardTile(index) {
            playSound('click');
            const playerHand = mahjongGame.players[0];
            const discarded = playerHand.splice(index, 1)[0];
            mahjongGame.sortHand(playerHand);
            
            // 加入桌面牌河
            mahjongGame.discards[0].push(discarded);
            updateDiscardsRiver();

            document.getElementById("game-status-text").textContent = `你打出了【${formatTileName(discarded)}】，等待其他對手反應...`;
            renderGameTable();

            // 模擬 AI 回合反應
            setTimeout(() => {
                aiTurnAction();
            }, 1000);
        }

        // 更新中央牌河視覺
        function updateDiscardsRiver() {
            const river = document.getElementById("discards-river");
            const allDiscards = mahjongGame.discards.flat();
            if (allDiscards.length === 0) {
                river.innerHTML = `<span class="text-[11px] text-slate-500 font-bold">牌河尚無打出之牌</span>`;
                return;
            }
            river.innerHTML = allDiscards.map(t => `<div class="w-7 h-9 bg-amber-50 rounded border border-amber-300 flex items-center justify-center text-[10px] font-black shadow">${formatTileName(t)}</div>`).join('');
        }

        // AI 回合模擬
        function aiTurnAction() {
            const aiIdx = Math.floor(Math.random() * 3) + 1; // 1, 2, 3
            const aiHand = mahjongGame.players[aiIdx];
            if (aiHand && aiHand.length > 0) {
                const aiDiscard = aiHand.pop();
                mahjongGame.discards[aiIdx].push(aiDiscard);
                updateDiscardsRiver();
                
                const names = ["", "上家 AI", "對家 AI", "下家 AI"];
                document.getElementById("game-status-text").textContent = `${names[aiIdx]} 打出了【${formatTileName(aiDiscard)}】`;
                triggerAiSpeech(aiIdx);
            }
        }

        function triggerAiSpeech(aiIdx) {
            const speechIds = ["", "ai-left-speech", "ai-top-speech", "ai-right-speech"];
            const msgs = ["聽牌囉！", "這張安全啦", "碰！", "小心放銃"];
            const el = document.getElementById(speechIds[aiIdx]);
            if (el) {
                el.textContent = msgs[Math.floor(Math.random() * msgs.length)];
                el.classList.remove("hidden");
                setTimeout(() => el.classList.add("hidden"), 2000);
            }
        }

        // 檢查玩家吃、碰、槓、聽、胡動作
        function checkPlayerActions() {
            const container = document.getElementById("action-buttons-container");
            container.innerHTML = "";
            const playerHand = mahjongGame.players[0];

            // 嚴謹呼叫 MahjongEngine 的 canWin 判定
            const canWin = mahjongGame.canWin(playerHand);

            let buttonsHtml = '';
            if (canWin) {
                buttonsHtml += `<button onclick="playerDeclareWin()" class="bounce-action btn-star-red px-5 py-2 rounded-2xl text-sm font-black animate-pulse">胡啦！</button>`;
            }
            buttonsHtml += `
                <button onclick="performAction('吃')" class="bounce-action bg-blue-600 hover:bg-blue-700 text-white font-black px-4 py-2 rounded-2xl shadow-xl border-2 border-blue-300 text-xs">吃</button>
                <button onclick="performAction('碰')" class="bounce-action bg-amber-500 hover:bg-amber-600 text-white font-black px-4 py-2 rounded-2xl shadow-xl border-2 border-amber-300 text-xs">碰</button>
                <button onclick="performAction('槓')" class="bounce-action bg-purple-600 hover:bg-purple-700 text-white font-black px-4 py-2 rounded-2xl shadow-xl border-2 border-purple-300 text-xs">槓</button>
                <button onclick="performAction('聽')" class="bounce-action bg-teal-600 hover:bg-teal-700 text-white font-black px-4 py-2 rounded-2xl shadow-xl border-2 border-teal-300 text-xs">聽牌</button>
            `;
            container.innerHTML = buttonsHtml;
        }

        window.performAction = function(actionName) {
            playSound('action');
            alert(`您宣告了【${actionName}】！`);
        };

        // 玩家胡牌結算
        window.playerDeclareWin = function() {
            playSound('win');
            const winAmount = currentStakes.base * currentStakes.tai * 2;
            userData.chips += winAmount;
            userData.winCount = (userData.winCount || 0) + 1;
            userData.selfDrawCount = (userData.selfDrawCount || 0) + 1;
            updateUI();
            saveUserDataToFirebase();
            alert(`🎉 恭喜胡牌！獲得獎金 +${winAmount.toLocaleString()} 籌碼！`);
            leaveTable();
        };

        async function saveUserDataToFirebase() {
            if (!currentUser) return;
            const userRef = ref(database, `users/${currentUser.uid}`);
            await update(userRef, userData);
            updateLastSavedTime();
        }

        // 排行榜與徽章 Modal
        window.openModal = async function(modalId) {
            playSound('click');
            document.getElementById(modalId).classList.remove("hidden");
            document.getElementById(modalId).classList.add("flex");
            if (modalId === 'ranking-modal') await loadRankingList();
            else if (modalId === 'badge-modal') loadBadges();
        };

        window.closeModal = function(modalId) {
            playSound('click');
            document.getElementById(modalId).classList.remove("flex");
            document.getElementById(modalId).classList.add("hidden");
        };

        async function loadRankingList() {
            const usersRef = ref(database, 'users');
            const snap = await get(usersRef);
            const listContainer = document.getElementById("ranking-list");
            listContainer.innerHTML = "";
            if (snap.exists()) {
                const usersArr = Object.values(snap.val()).sort((a, b) => b.chips - a.chips);
                usersArr.forEach((u, idx) => {
                    const row = document.createElement("div");
                    row.className = "flex justify-between items-center p-3 bg-slate-100 rounded-2xl font-bold text-sm";
                    row.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <span class="w-7 h-7 rounded-full bg-amber-400 text-slate-950 flex items-center justify-center font-black text-xs">${idx + 1}</span>
                            <span class="text-slate-800">${u.nickname}</span>
                        </div>
                        <span class="text-emerald-600 font-black">${(u.chips || 0).toLocaleString()} 籌碼</span>
                    `;
                    listContainer.appendChild(row);
                });
            }
        }

        function loadBadges() {
            const grid = document.getElementById("badge-grid");
            const wins = userData.winCount || 0;
            const logins = userData.loginCount || 0;
            const selfDraws = userData.selfDrawCount || 0;

            const badges = [
                { name: "初試啼聲", desc: "胡牌達 1 次", unlocked: wins >= 1, icon: "fa-star" },
                { name: "雀神降臨", desc: "胡牌達 5 次", unlocked: wins >= 5, icon: "fa-crown" },
                { name: "天天登入", desc: "登入達 3 次", unlocked: logins >= 3, icon: "fa-calendar-check" },
                { name: "自摸高手", desc: "自摸達 3 次", unlocked: selfDraws >= 3, icon: "fa-hand-sparkles" }
            ];

            grid.innerHTML = badges.map(b => `
                <div class="p-4 rounded-2xl border-2 ${b.unlocked ? 'border-amber-400 bg-amber-50/50' : 'border-slate-200 bg-slate-50 opacity-50'} flex flex-col items-center text-center">
                    <div class="w-12 h-12 rounded-2xl ${b.unlocked ? 'bg-amber-500 text-white shadow-lg' : 'bg-slate-300 text-slate-500'} flex items-center justify-center text-xl mb-2">
                        <i class="fa-solid ${b.icon}"></i>
                    </div>
                    <h4 class="font-black text-slate-900 text-sm">${b.name}</h4>
                    <p class="text-[11px] text-slate-500 font-bold mt-0.5">${b.desc}</p>
                    <span class="text-[10px] font-extrabold mt-2 px-2 py-0.5 rounded-full ${b.unlocked ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'}">${b.unlocked ? '已解鎖' : '未解鎖'}</span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
